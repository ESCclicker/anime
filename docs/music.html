<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anime Music</title>

  <!-- ICONS -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      min-height:100vh;

      background:
        radial-gradient(circle at top left,
          rgba(34,197,94,0.15),
          transparent 30%),

        radial-gradient(circle at bottom right,
          rgba(16,185,129,0.15),
          transparent 30%),

        #050505;

      color:white;

      font-family:Arial,sans-serif;

      padding:20px;
      padding-top:90px; /* IMPORTANT for navbar */
    }

    .container{
      max-width:1000px;
      margin:auto;
    }

    /* ================= NAVBAR ================= */

    .top-nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);

      width: calc(100% - 32px);
      max-width: 1000px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 16px;

      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);

      border-radius: 18px;

      z-index: 999;
    }

    .nav-title {
      font-size: 18px;
      font-weight: bold;
      color: white;
      letter-spacing: 1px;
    }

    .nav-right {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      text-decoration: none;
      color: white;

      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);

      transition: 0.2s;
    }

    .nav-btn:hover {
      transform: scale(1.1);
      border-color: rgba(34,197,94,0.5);
      box-shadow: 0 0 20px rgba(34,197,94,0.2);
    }

    /* ================= SONG LIST ================= */

    .song-list{

      display:flex;
      flex-direction:column;

      gap:22px;
    }

    .song{

      background:rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(20px);

      border-radius:28px;

      padding:22px;

      transition:0.3s;
    }

    .song:hover{

      transform:translateY(-6px);

      border-color:rgba(34,197,94,0.4);

      box-shadow:0 20px 50px rgba(34,197,94,0.18);
    }

    .song-info{
      margin-bottom:18px;
    }

    .song-title{
      font-size:24px;
      font-weight:bold;
    }

    .anime-name{
      margin-top:6px;
      color:#a1a1aa;
      font-size:15px;
    }

    iframe{
      border:none;
      border-radius:12px;
    }

    /* ================= MOBILE ================= */

    @media(max-width:700px){

      body{
        padding:14px;
        padding-top:80px;
      }

      .nav-title{
        font-size:14px;
      }

      .nav-btn{
        width:36px;
        height:36px;
      }

      .song-title{
        font-size:20px;
      }
    }

  </style>

</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <div class="top-nav">

    <a href="page1.html" class="nav-btn">
      <i class="fa-solid fa-house"></i>
    </a>

    <div class="nav-title">
      Anime Music
    </div>

    <div class="nav-right">

      <a href="music.html" class="nav-btn">
        <i class="fa-solid fa-music"></i>
      </a>

      <a href="https://github.com/" class="nav-btn">
        <i class="fa-brands fa-github"></i>
      </a>

      <a href="https://telegram.org/" class="nav-btn">
        <i class="fa-brands fa-telegram"></i>
      </a>

    </div>

  </div>

  <!-- ================= CONTENT ================= -->

  <div class="container">

    <div class="song-list">

      <!-- SONG 1 -->
      <div class="song">
        <div class="song-info">
          <div class="song-title">Unravel</div>
          <div class="anime-name">Tokyo Ghoul</div>
        </div>

        <iframe loading="lazy"
          src="https://open.spotify.com/embed/track/1rN9QoVxw5U7TJkyaUR8C1?utm_source=generator"
          width="100%" height="152"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
      </div>

      <!-- SONG 2 -->
      <div class="song">
        <div class="song-info">
          <div class="song-title">Gurenge</div>
          <div class="anime-name">Demon Slayer</div>
        </div>

        <iframe loading="lazy"
          src="https://open.spotify.com/embed/track/41tYgm5VUu1awE3Cp36LIm?utm_source=generator&theme=0"
          width="100%" height="152"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
      </div>

      <!-- SONG 3 -->
      <div class="song">
        <div class="song-info">
          <div class="song-title">Bling-Bang-Bang-Born</div>
          <div class="anime-name">Mashle Magic and Muscles</div>
        </div>

        <iframe loading="lazy"
          src="https://open.spotify.com/embed/track/0kdqcbwei4MDWFEX5f33yG?utm_source=generator"
          width="100%" height="152"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
      </div>

      <!-- SONG 4 -->
      <div class="song">
        <div class="song-info">
          <div class="song-title">Erwin Smith Last Speech</div>
          <div class="anime-name">Attack on Titan</div>
        </div>

        <iframe loading="lazy"
          src="https://open.spotify.com/embed/track/6ipGidttUaUXmA0Ke2lLjR?utm_source=generator"
          width="100%" height="152"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
      </div>

    </div>

  </div>

</body>

</html>
