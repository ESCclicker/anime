<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>私のアニメ</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
    }

    /* 🎬 VIDEO BACKGROUND */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;

      z-index: -2;

      filter: brightness(0.35) contrast(1.2) saturate(1.2);
      transform: scale(1.05);
    }

    
  .overlay {
  position: fixed;
  inset: 0;
  z-index: -1;

  background: radial-gradient(
    circle at center,
    rgba(0,0,0,0.05) 0%,
    rgba(0,0,0,0.45) 60%,
    rgba(0,0,0,0.75) 100%
  );
}

    /* 🎯 CENTER CONTENT */
    .center {
      position: relative;
      z-index: 2;
      height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;
    }

    /* ✨ TITLE */
.title {
  font-size: 64px;
  font-weight: 900;
  letter-spacing: -2px;

  background: linear-gradient(90deg, #f97316, #facc15, #fb7185, #f97316);
  background-size: 300% 100%;

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  animation: fireFlow 4s linear infinite;

  text-shadow:
    0 0 15px rgba(249,115,22,0.5),
    0 0 35px rgba(250,204,21,0.3);
}

@keyframes fireFlow {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

    .subtitle {
  margin-top: 10px;
  color: rgba(255,255,255,0.75);
  font-size: 16px;

  text-shadow:
    0 0 10px rgba(255,140,0,0.2);
}

    /* 🔵 ENTER BUTTON */
.enter-btn {
  margin-top: 30px;

  padding: 14px 42px;
  border-radius: 16px;

  text-decoration: none;
  color: white;

  border: 1px solid rgba(250,204,21,0.6);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);

  font-weight: bold;
  letter-spacing: 2px;

  transition: 0.3s;

  box-shadow:
    0 0 15px rgba(249,115,22,0.4),
    0 0 40px rgba(250,204,21,0.2);

  animation: btnPulse 2.5s infinite;
}

    .enter-btn:hover {
  transform: scale(1.08);
  box-shadow:
    0 0 60px rgba(249,115,22,0.6),
    0 0 100px rgba(250,204,21,0.3);
}

@keyframes btnPulse {
  0%, 100% {
    box-shadow:
      0 0 15px rgba(249,115,22,0.3),
      0 0 35px rgba(250,204,21,0.15);
  }

  50% {
    box-shadow:
      0 0 25px rgba(249,115,22,0.6),
      0 0 60px rgba(250,204,21,0.25);
  }
}

    /* 📱 MOBILE */
    @media (max-width: 700px) {

      .title {
        font-size: 38px;
      }

      .enter-btn {
        padding: 12px 30px;
        font-size: 14px;
      }
    }

  </style>

</head>

<body>

  <!-- 🎬 BACKGROUND VIDEO -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="background_video/new_bg.mp4" type="video/mp4">
  </video>

  <!-- 🌑 OVERLAY -->
  <div class="overlay"></div>

  <!-- 🎯 CENTER CONTENT -->
  <div class="center">

    <div class="title">私のアニメ</div>
    <div class="subtitle">あなたのアニメスペースに入る</div>

    <a href="page1.html" class="enter-btn">
      ENTER
    </a>

  </div>

</body>

</html>
